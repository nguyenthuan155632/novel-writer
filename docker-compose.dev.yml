services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel
      POSTGRES_DB: novel_factory
    ports:
      - "5432:5432"
    volumes:
      - novel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel -d novel_factory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  novel_pg_data: