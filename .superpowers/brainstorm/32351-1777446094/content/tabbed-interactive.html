<h2>Interactive Tab Demo</h2>
<p class="subtitle">Click tabs to see the layout switch</p>

<div class="mockup">
  <div class="mockup-header">Bible Edit Form - Interactive</div>
  <div class="mockup-body" style="padding: 20px;">
    <!-- Tab Navigation -->
    <div style="display: flex; border-bottom: 2px solid #e5e5e5; margin-bottom: 20px;">
      <button onclick="switchTab('world')" id="tab-world" style="padding: 12px 24px; border: none; background: #1a4ed8; color: white; font-weight: 600; cursor: pointer; border-radius: 6px 6px 0 0;">World</button>
      <button onclick="switchTab('systems')" id="tab-systems" style="padding: 12px 24px; border: none; background: #f0f0f0; color: #666; font-weight: 600; cursor: pointer; border-radius: 6px 6px 0 0; margin-left: 4px;">Systems</button>
      <button onclick="switchTab('style')" id="tab-style" style="padding: 12px 24px; border: none; background: #f0f0f0; color: #666; font-weight: 600; cursor: pointer; border-radius: 6px 6px 0 0; margin-left: 4px;">Style</button>
      <button onclick="switchTab('summary')" id="tab-summary" style="padding: 12px 24px; border: none; background: #f0f0f0; color: #666; font-weight: 600; cursor: pointer; border-radius: 6px 6px 0 0; margin-left: 4px;">Summary</button>
    </div>
    
    <!-- Tab Content -->
    <div id="content-world" style="background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 20px;">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px;">World Rules</label>
        <textarea rows="8" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 100%; font: inherit; resize: vertical; min-height: 200px;" placeholder="Describe the world rules, setting, and environment..."></textarea>
        <div style="display: flex; justify-content: space-between; margin-top: 8px; color: #666; font-size: 14px;">
          <span>0 words</span>
          <span>0 / 5000 characters</span>
        </div>
      </div>
    </div>
    
    <div id="content-systems" style="background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 20px; display: none;">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px;">Cultivation System</label>
        <textarea rows="6" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 100%; font: inherit; resize: vertical; min-height: 180px;" placeholder="Describe the cultivation system..."></textarea>
        <div style="display: flex; justify-content: space-between; margin-top: 8px; color: #666; font-size: 14px;">
          <span>0 words</span>
          <span>0 characters</span>
        </div>
      </div>
      
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px;">Bloodline System</label>
        <textarea rows="6" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 100%; font: inherit; resize: vertical; min-height: 180px;" placeholder="Describe the bloodline system..."></textarea>
        <div style="display: flex; justify-content: space-between; margin-top: 8px; color: #666; font-size: 14px;">
          <span>0 words</span>
          <span>0 characters</span>
        </div>
      </div>
    </div>
    
    <div id="content-style" style="background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 20px; display: none;">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px;">Style Guide</label>
        <textarea rows="6" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 100%; font: inherit; resize: vertical; min-height: 180px;" placeholder="Describe the writing style guide..."></textarea>
        <div style="display: flex; justify-content: space-between; margin-top: 8px; color: #666; font-size: 14px;">
          <span>0 words</span>
          <span>0 characters</span>
        </div>
      </div>
      
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px;">Forbidden Rules</label>
        <textarea rows="6" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 100%; font: inherit; resize: vertical; min-height: 180px;" placeholder="List forbidden rules and elements..."></textarea>
        <div style="display: flex; justify-content: space-between; margin-top: 8px; color: #666; font-size: 14px;">
          <span>0 words</span>
          <span>0 characters</span>
        </div>
      </div>
    </div>
    
    <div id="content-summary" style="background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 20px; display: none;">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px;">Ending Direction</label>
        <textarea rows="4" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 100%; font: inherit; resize: vertical; min-height: 120px;" placeholder="Describe the planned ending direction..."></textarea>
        <div style="display: flex; justify-content: space-between; margin-top: 8px; color: #666; font-size: 14px;">
          <span>0 words</span>
          <span>0 characters</span>
        </div>
      </div>
      
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px;">Compact Summary (≤ 1500 words)</label>
        <textarea rows="8" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 100%; font: inherit; resize: vertical; min-height: 200px;" placeholder="Write a compact summary for HOT cache..."></textarea>
        <div style="display: flex; justify-content: space-between; margin-top: 8px; color: #666; font-size: 14px;">
          <span>0 / 1500 words</span>
          <span>0 characters</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  // Hide all content
  document.getElementById('content-world').style.display = 'none';
  document.getElementById('content-systems').style.display = 'none';
  document.getElementById('content-style').style.display = 'none';
  document.getElementById('content-summary').style.display = 'none';
  
  // Reset all tabs
  document.getElementById('tab-world').style.background = '#f0f0f0';
  document.getElementById('tab-world').style.color = '#666';
  document.getElementById('tab-systems').style.background = '#f0f0f0';
  document.getElementById('tab-systems').style.color = '#666';
  document.getElementById('tab-style').style.background = '#f0f0f0';
  document.getElementById('tab-style').style.color = '#666';
  document.getElementById('tab-summary').style.background = '#f0f0f0';
  document.getElementById('tab-summary').style.color = '#666';
  
  // Show selected content and highlight tab
  document.getElementById('content-' + tab).style.display = 'block';
  document.getElementById('tab-' + tab).style.background = '#1a4ed8';
  document.getElementById('tab-' + tab).style.color = 'white';
}
</script>
